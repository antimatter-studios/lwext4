# SPDX-License-Identifier: BSD-3-Clause
#
# qemu_cortex_m3: TI LM3S6965 (Cortex-M3, 64 KiB SRAM, 256 KiB flash) with
# an SD card on its SSI0 SPI controller, see qemu_cortex_m3.overlay.

# The SPI controller driver (arm,pl022) gets its input clock through the
# clock control API
CONFIG_CLOCK_CONTROL=y

# The card's chip select is a GPIO pin
CONFIG_GPIO=y

# "west build -t run" boots the firmware with the SD card image card.img
# of the build directory in the socket. Create it first, e.g. with
# "truncate -s 32M build/card.img" (QEMU wants a power of two size).
CONFIG_QEMU_EXTRA_FLAGS="-drive if=sd,format=raw,file=card.img"
