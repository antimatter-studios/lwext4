#
# mps2/an385: Cortex-M3, 4 MiB SRAM, with a 2 MiB RAM disk, see
# mps2_an385.overlay.

# A second QEMU monitor on a socket in the build directory, besides the
# one on the console (Ctrl-a c): host/run_qemu_test.py asks it for a copy
# of the RAM disk ("pmemsave") once the firmware is done.
CONFIG_QEMU_EXTRA_FLAGS="-monitor unix:qemu-monitor.sock,server=on,wait=off"
