#
# Configuration of the example for every board; boards/<board>.conf and
# boards/<board>.overlay add the storage hardware.

# lwext4 (ports/zephyr/Kconfig) with its block device on the disk access
# API
CONFIG_LWEXT4=y
CONFIG_DISK_ACCESS=y
CONFIG_LWEXT4_DISK_ACCESS=y
# keep lwext4's internal consistency checks: a failed one stops the
# firmware (and so fails the test) instead of damaging the file system
CONFIG_LWEXT4_DEBUG_ASSERT=y

# lwext4 allocates its block cache and journal records with malloc(): the
# C library's heap takes all RAM left over (the default on MCUs); its
# statistics give the peak shown at the end.
CONFIG_SYS_HEAP_RUNTIME_STATS=y

# main() runs the example; lwext4 needs about 2 KiB of stack
CONFIG_MAIN_STACK_SIZE=4096
# stack high water mark of main() at the end
CONFIG_INIT_STACKS=y
CONFIG_THREAD_STACK_INFO=y

# Console output; driver messages (disk) at warning level and up
CONFIG_PRINTK=y
CONFIG_LOG=y
CONFIG_LOG_MODE_IMMEDIATE=y
CONFIG_LOG_DEFAULT_LEVEL=2

# Flashable images next to zephyr.elf
CONFIG_BUILD_OUTPUT_BIN=y
CONFIG_BUILD_OUTPUT_HEX=y
