# SPDX-License-Identifier: BSD-3-Clause
#
# Release of a `main` build. Push a tag vMAJOR.MINOR.PATCH (semantic
# versioning, see CONTRIBUTING.md) on a commit of `main`: the whole CI
# matrix runs on the tag, the release packages are built (each one running
# its own CTest suite, and taking its version from the tag), and only if
# every job passed and every package is of the tag's version is the GitHub
# release published with the packages, JUnit test results, test report and
# manifest.
name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  # A tag that is not vMAJOR.MINOR.PATCH stops here, before the matrix.
  tag:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - run: ci/scripts/release-version.sh "$GITHUB_REF_NAME"

  ci:
    needs: tag
    uses: ./.github/workflows/ci.yml
    with:
      ref: ${{ github.ref }}

  package-linux:
    name: package / linux-${{ matrix.arch }}
    needs: tag
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        arch: [x86_64, aarch64, armhf, i686, riscv64, ppc64le, s390x, powerpc, mips]
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - run: ci/run.sh package-linux ${{ matrix.arch }}
      - uses: actions/upload-artifact@v7
        with:
          name: dist-linux-${{ matrix.arch }}
          path: build-ci/dist/
          if-no-files-found: error

  package:
    name: package / ${{ matrix.job }}
    needs: tag
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        job: [package-mingw, package-cortex-m]
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - run: ci/run.sh ${{ matrix.job }}
      - uses: actions/upload-artifact@v7
        with:
          name: dist-${{ matrix.job }}
          path: build-ci/dist/
          if-no-files-found: error

  # ESP-IDF example firmware (examples/esp-idf): the QEMU tested chips and
  # the SD-over-SPI builds for real boards, flashable images per variant.
  package-esp32:
    name: package / esp-idf ${{ matrix.variant }}
    needs: tag
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - {variant: esp32, job: esp32-qemu, args: esp32}
          - {variant: esp32c3, job: esp32-qemu, args: esp32c3}
          - {variant: esp32s3, job: esp32-qemu, args: esp32s3}
          - {variant: esp32-sdspi, job: esp32-build, args: esp32 sdspi}
          - {variant: esp32c3-sdspi, job: esp32-build, args: esp32c3 sdspi}
          - {variant: esp32s3-sdspi, job: esp32-build, args: esp32s3 sdspi}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - run: ci/run.sh ${{ matrix.job }} ${{ matrix.args }}
      - name: Package flashable images
        run: |
          name="lwext4-$(git describe --tags --always | sed 's/^v//')-esp-idf-${{ matrix.variant }}"
          mkdir -p build-ci/dist "build-ci/pkg/$name"
          cp -a "examples/esp-idf/dist/${{ matrix.variant }}/." "build-ci/pkg/$name/"
          cp LICENSE "build-ci/pkg/$name/"
          tar -C build-ci/pkg -czf "build-ci/dist/$name.tar.gz" "$name"
      - uses: actions/upload-artifact@v7
        with:
          name: dist-esp-idf-${{ matrix.variant }}
          path: build-ci/dist/
          if-no-files-found: error

  # Bare-metal SD card example firmware (examples/baremetal-sdcard): built
  # and tested in Renode per board, flashable images per board.
  package-baremetal-sdcard:
    name: package / baremetal-sdcard ${{ matrix.board }}
    needs: tag
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        board: [nucleo_f401re, nucleo_g071rb, nucleo_l552ze_q, nrf52840dk]
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - run: ci/run.sh baremetal-sdcard-build ${{ matrix.board }}
      - run: ci/run.sh renode-baremetal-sdcard ${{ matrix.board }}
      - name: Package flashable images
        run: |
          name="lwext4-$(git describe --tags --always | sed 's/^v//')-baremetal-sdcard-${{ matrix.board }}"
          mkdir -p build-ci/dist "build-ci/pkg/$name"
          cp -a "examples/baremetal-sdcard/dist/${{ matrix.board }}/." "build-ci/pkg/$name/"
          cp LICENSE "build-ci/pkg/$name/"
          tar -C build-ci/pkg -czf "build-ci/dist/$name.tar.gz" "$name"
      - uses: actions/upload-artifact@v7
        with:
          name: dist-baremetal-sdcard-${{ matrix.board }}
          path: build-ci/dist/
          if-no-files-found: error

  # Zephyr example firmware (examples/zephyr): built with west and tested
  # in QEMU per board, flashable images per board.
  package-zephyr:
    name: package / zephyr ${{ matrix.board }}
    needs: tag
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - {board: mps2/an385, name: mps2_an385}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - run: ci/run.sh zephyr-qemu ${{ matrix.board }}
      - name: Package flashable images
        run: |
          name="lwext4-$(git describe --tags --always | sed 's/^v//')-zephyr-${{ matrix.name }}"
          mkdir -p build-ci/dist "build-ci/pkg/$name"
          cp -a "examples/zephyr/dist/${{ matrix.name }}/." "build-ci/pkg/$name/"
          cp LICENSE "build-ci/pkg/$name/"
          tar -C build-ci/pkg -czf "build-ci/dist/$name.tar.gz" "$name"
      - uses: actions/upload-artifact@v7
        with:
          name: dist-zephyr-${{ matrix.name }}
          path: build-ci/dist/
          if-no-files-found: error

  publish:
    needs: [ci, package-linux, package, package-esp32, package-baremetal-sdcard, package-zephyr]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: The tag must be on main
        run: |
          git fetch origin main
          git merge-base --is-ancestor "$GITHUB_SHA" FETCH_HEAD
      - uses: actions/download-artifact@v8
        with:
          path: build-ci/dist
          pattern: dist-*
          merge-multiple: true
      - name: Every package is of the tag's version
        run: ci/scripts/release-version.sh "$GITHUB_REF_NAME" build-ci/dist
      - name: Manifest, test report, notes
        run: |
          python3 ci/scripts/release-notes.py "$GITHUB_REF_NAME" build-ci/dist \
            "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd build-ci/dist
          gh release create "$GITHUB_REF_NAME" --verify-tag \
            --title "lwext4 $GITHUB_REF_NAME" --notes-file RELEASE-NOTES.md \
            *.tar.gz *.xml MANIFEST.md TEST-REPORT.md
