# SPDX-License-Identifier: BSD-3-Clause
#
# Rebuild `integration` from ci/integration/branches.txt (upstream master +
# every topic branch, merge conflicts fail) and run the full CI matrix on it.
#
# Run it with "gh workflow run Integration --ref integration" (the CI matrix
# it runs is the ci.yml of that ref, the full one on integration), or from the
# Actions tab. GitHub does not let the workflow token push commits that
# change files in .github/workflows, which merging the CI branches does, so:
#   - with a repository secret INTEGRATION_PUSH_TOKEN (a token with the
#     `workflow` scope) the job pushes the rebuilt branch itself;
#   - without it, the job only checks that `integration` is exactly the
#     rebuild (merges are reproducible), i.e. that a maintainer pushed it
#     with ci/integration/rebuild.sh --push.
# Pushes to integration by a maintainer also run ci.yml directly.
name: Integration

on:
  workflow_dispatch:
  # A push to integration checks that it is exactly the reproducible rebuild.
  push:
    branches: [integration]

concurrency:
  group: integration-rebuild

permissions:
  contents: read

jobs:
  rebuild:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    outputs:
      sha: ${{ steps.result.outputs.sha }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          token: ${{ secrets.INTEGRATION_PUSH_TOKEN || github.token }}
      - name: Rebuild
        env:
          HAVE_PUSH_TOKEN: ${{ secrets.INTEGRATION_PUSH_TOKEN != '' }}
        run: |
          if [ "$HAVE_PUSH_TOKEN" = true ]; then
            ci/run.sh integration-rebuild --push origin
          else
            ci/run.sh integration-rebuild --check origin
          fi
      - id: result
        run: echo "sha=$(git rev-parse integration)" >> "$GITHUB_OUTPUT"
      - run: cat build-ci/integration/manifest.md >> "$GITHUB_STEP_SUMMARY"

  ci:
    needs: rebuild
    uses: ./.github/workflows/ci.yml
    with:
      ref: ${{ needs.rebuild.outputs.sha }}
