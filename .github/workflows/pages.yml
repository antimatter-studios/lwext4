# SPDX-License-Identifier: BSD-3-Clause
#
# The project site (fork issue #166), https://antimatter-studios.github.io/lwext4/:
# `ci/run.sh pages` builds it from the repository (docs/site/build.py,
# Doxygen, MkDocs). Pull requests build it, so a broken link or page fails
# their check; main deploys it to GitHub Pages after every merge.
name: Pages

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  build:
    # The required check of pull requests
    name: pages
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - run: ci/run.sh pages
      - if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v5
        with:
          path: build-ci/pages/site

  deploy:
    name: pages-deploy
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v5
